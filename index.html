<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draw</title>
  <link rel="icon" href="static/draw_favicon.png">

  <link rel="stylesheet" href="static/css/bootstrap.min.css" />

  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <div id="toolbar">
    <div id="toolbarheader">Toobar</div>
    <input id="stroke-color-selector" type="color" class="color-selector" value="#000000" data-bs-toggle="tooltip" title="Stroke Color">
    <input id="fill-color-selector" type="color" class="color-selector" value="#ffffff" data-bs-toggle="tooltip" title="Fill Color">
    <input id="opacity-selector" type="range" class="form-range" style="width: 83px" value="10" min="0.1" max="10.1" data-bs-toggle="tooltip" title="Opacity">
    <input id="stroke-width-selector" type="range" class="form-range" style="width: 83px" value="3" max="15" data-bs-toggle="tooltip" title="Stroke Width">
  </div>

  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand">
      <div class="container-fluid">
        <img src="static/draw_favicon.png" width="30" height="30" alt="Draw">
      </div>
    </a>
    <ul class="nav nav-pills me-auto">
      <li class="nav-item">
        <a id="pan-select-button" class="function-button nav-link" href="#" onclick="changeFunction('pan')">Pan</a>
      </li>
      <li class="nav-item">
        <a id="select-select-button" class="function-button nav-link" href="#"
          onclick="changeFunction('select')">Select</a>
      </li>
      <li class="nav-item">
        <a id="pen-select-button" class="function-button nav-link" href="#" onclick="changeFunction('pen')">Pen</a>
      </li>
      <a id="brush-select-button" class="function-button nav-link" href="#" onclick="changeFunction('brush')">Brush</a>
      <li class="nav-item dropdown">
        <a id="shape-select-button" class="nav-link dropdown-toggle function-button active" data-bs-toggle="dropdown"
          href="#" role="button" aria-haspopup="true" aria-expanded="false">Circle</a>
        <div class="dropdown-menu">
          <a id="line-select-button" class="function-button dropdown-item" href="#"
            onclick="changeFunction('line')">Line</a>
          <a id="circle-select-button" class="function-button dropdown-item active" href="#"
            onclick="changeFunction('circle')">Circle</a>
          <a id="ellipse-select-button" class="function-button dropdown-item" href="#"
            onclick="changeFunction('ellipse')">Ellipse</a>
          <a id="rectangle-select-button" class="function-button dropdown-item" href="#"
            onclick="changeFunction('rectangle')">Rectangle</a>
        </div>
      </li>
      <li class="nav-item">
        <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="Coming soon">
          <a id="text-select-button" class="function-button nav-link disabled" href="#"
            onclick="changeFunction('text')">Text</a>
        </span>
      </li>
      <!-- <li class="nav-item">
        <a id="add-select-button" class="function-button nav-link" href="#" onclick="addDoodle()">Add</a>
      </li> -->
    </ul>
    <ul class="nav justify-content-end">
      <li class="nav-item">
        <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="Undo">
          <a id="undo-button" class="nav-link disabled" href="#" onclick="undoAction()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-arrow-counterclockwise" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2z"/>
              <path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466"/>
            </svg>
          </a>
        </span>
      </li>
      <li class="nav-item">
        <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="Redo">
          <a id="redo-button" class="nav-link disabled" href="#" onclick="redoAction()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
          </svg>
          </a>
        </span>
      </li>
      <li class="nav-item">
        <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="Save">
          <a id="save-button" class="nav-link" href="#" onclick="saveCanvas()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-file-arrow-down" viewBox="0 0 16 16">
              <path d="M8 5a.5.5 0 0 1 .5.5v3.793l1.146-1.147a.5.5 0 0 1 .708.708l-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 1 1 .708-.708L7.5 9.293V5.5A.5.5 0 0 1 8 5"/>
              <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1"/>
            </svg>
          </a>
        </span>
      </li>
      <li class="nav-item"> 
        <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="Load">
          <a id="load-button" class="nav-link" href="#" onclick="loadCanvas()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-file-arrow-up" viewBox="0 0 16 16">
              <path d="M8 11a.5.5 0 0 0 .5-.5V6.707l1.146 1.147a.5.5 0 0 0 .708-.708l-2-2a.5.5 0 0 0-.708 0l-2 2a.5.5 0 1 0 .708.708L7.5 6.707V10.5a.5.5 0 0 0 .5.5"/>
              <path d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1"/>
            </svg>
          </a>
        </span>
      </li>
      <li class="nav-item">
        <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="New">
          <a id="new-button" class="nav-link" href="#" onclick="newCanvas()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-file-plus" viewBox="0 0 16 16">
              <path d="M8.5 6a.5.5 0 0 0-1 0v1.5H6a.5.5 0 0 0 0 1h1.5V10a.5.5 0 0 0 1 0V8.5H10a.5.5 0 0 0 0-1H8.5z"/>
              <path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2zm10-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1"/>
            </svg>
          </a>
        </span>
      </li>
      <li class="nav-item">
        <!-- <a id="new-button" class="nav-link" href="#" onclick="toggleFullScreen()">Full</a> -->
        <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="Fullscreen">
        <a id="new-button" class="nav-link" href="#" onclick="toggleFullScreen()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-fullscreen" viewBox="0 0 16 16">
            <path id="fullscreen-button" d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5M.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5m15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5"/>
          </svg>
        </a>
        </span>
      </li>
    </ul>
  </nav>
  <canvas id="myCanvas" resize></canvas>

  <input id="file-input" type="file" style="display:none;" accept=".svg"></input>
  <a id="source-text" href="https://github.com/Achiria/drawapp" target="_blank" rel="noopener noreferrer">Source</a>


  <script type="text/javascript" src="static/js/jquery-4.0.0.min.js"></script>
  <script type="text/javascript" src="static/js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="static/js/paper-full.min.js"></script>
  <script type="text/javascript" src="static/js/jquery.mousewheel.min.js"></script>

  <script type="text/paperscript" src="js/paper.js" canvas="myCanvas"></script>
  <script type="text/javascript" src="js/index.js" defer></script>

  <script>

    //       left: e.pageX, display: "block"
    //     });
    //   });
    // });
  </script>
</body>


</html>
